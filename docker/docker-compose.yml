version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bingoroute_postgres
    environment:
      POSTGRES_DB: skn_travel_db
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django -d skn_travel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bingoroute_backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      - DEBUG=1
      - DB_HOST=postgres
      - DB_NAME=skn_travel_db
      - DB_USER=django
      - DB_PASSWORD=django1234
      - DB_PORT=5432
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    # Ensure entrypoint runs even if bind-mounted file loses +x
    entrypoint: ["sh", "/app/docker/entrypoint.sh"]

volumes:
  postgres_data:
